<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liderlik Tablosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; overflow: hidden; }
        .neon-text {
            text-shadow: 0 0 10px #4f46e5, 0 0 20px #4f46e5;
        }
        .row-enter {
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateX(-50px);
        }
        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        .rank-1 { background: linear-gradient(90deg, rgba(251,191,36,0.2) 0%, transparent 100%); border-left: 4px solid #fbbf24; color: #fbbf24;}
        .rank-2 { background: linear-gradient(90deg, rgba(156,163,175,0.2) 0%, transparent 100%); border-left: 4px solid #9ca3af; color: #9ca3af;}
        .rank-3 { background: linear-gradient(90deg, rgba(180,83,9,0.2) 0%, transparent 100%); border-left: 4px solid #b45309; color: #b45309;}
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-8 font-sans">

    <header class="text-center mb-10 mt-6">
        <h1 class="text-6xl md:text-8xl font-black tracking-wider text-indigo-400 mb-4 neon-text uppercase">En İyiler</h1>
        <p class="text-3xl text-gray-400">Yapay Zeka Farkındalık Oyunu Liderlik Tablosu</p>
    </header>

    <div class="flex-1 max-w-6xl w-full mx-auto bg-slate-800/50 rounded-3xl p-8 backdrop-blur-sm border border-slate-700 shadow-2xl overflow-hidden flex flex-col">
        
        <div class="grid grid-cols-12 gap-4 text-2xl font-bold text-slate-400 mb-6 px-6 uppercase tracking-wider">
            <div class="col-span-2 text-center">Sıra</div>
            <div class="col-span-7">İsim</div>
            <div class="col-span-3 text-right">Puan</div>
        </div>

        <div id="leaderboard-container" class="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-4 pb-4">
            <!-- Rows injected here -->
        </div>

    </div>

<script>
function renderLeaderboard() {
    const container = document.getElementById('leaderboard-container');
    const data = JSON.parse(localStorage.getItem('aiGameLeaderboard')) || [];
    
    container.innerHTML = '';

    if (data.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-500 text-3xl mt-12">Henüz kayıt yok. İlk oynayan sen ol!</div>';
        return;
    }

    data.forEach((entry, index) => {
        const row = document.createElement('div');
        row.className = `row-enter grid grid-cols-12 gap-4 items-center text-3xl font-semibold bg-slate-800/80 rounded-xl p-5 px-6 transition-all`;
        row.style.animationDelay = `${index * 0.05}s`;

        if (index === 0) {
            row.classList.add('rank-1');
            row.innerHTML = `
                <div class="col-span-2 text-center font-black text-5xl">🥇</div>
                <div class="col-span-7 truncate">${entry.name}</div>
                <div class="col-span-3 text-right font-mono text-4xl">${entry.score}</div>
            `;
        }
        else if (index === 1) {
            row.classList.add('rank-2');
            row.innerHTML = `
                <div class="col-span-2 text-center font-black text-4xl">🥈</div>
                <div class="col-span-7 truncate">${entry.name}</div>
                <div class="col-span-3 text-right font-mono text-4xl">${entry.score}</div>
            `;
        }
        else if (index === 2) {
            row.classList.add('rank-3');
            row.innerHTML = `
                <div class="col-span-2 text-center font-black text-4xl">🥉</div>
                <div class="col-span-7 truncate">${entry.name}</div>
                <div class="col-span-3 text-right font-mono text-4xl">${entry.score}</div>
            `;
        }
        else {
            row.classList.add('text-slate-200');
            row.innerHTML = `
                <div class="col-span-2 text-center font-black text-3xl text-slate-500">#${index + 1}</div>
                <div class="col-span-7 truncate">${entry.name}</div>
                <div class="col-span-3 text-right font-mono text-3xl">${entry.score}</div>
            `;
        }

        container.appendChild(row);
    });
}

// Initial render
renderLeaderboard();

// Update when localStorage changes (e.g. from another tab)
window.addEventListener('storage', (e) => {
    if (e.key === 'aiGameLeaderboard' || e.key === null) {
        renderLeaderboard();
    }
});

// Periodic check just in case storage event doesn't fire nicely locally
setInterval(() => {
    const currentDataStr = localStorage.getItem('aiGameLeaderboard');
    // Simple check if data changed, if so re-render to avoid unnecessary repaints
    if (window.lastDataStr !== currentDataStr) {
        window.lastDataStr = currentDataStr;
        renderLeaderboard();
    }
}, 2000);

</script>
</body>
</html>
