<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerçek Olanı Bul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; }
        .image-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .image-card:hover { transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .image-card.correct { border: 4px solid #22c55e; }
        .image-card.wrong { border: 4px solid #ef4444; }
        @keyframes morphInTop {
            0% { transform: translateY(-4rem) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes morphInBottom {
            0% { transform: translateY(4rem) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes morphInCenter {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-top-down {
            animation: morphInTop 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .anim-bottom-up {
            animation: morphInBottom 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .anim-center {
            animation: morphInCenter 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 h-screen w-screen font-sans text-slate-100 overflow-hidden">

<div id="app" class="bg-slate-900 w-full h-full flex flex-col relative">
    
    <!-- Screen 1: Start -->
    <div id="screen-start" class="flex-1 flex flex-col items-center justify-center p-8 text-center">
        <h2 class="text-4xl font-semibold mb-6 text-indigo-400">Yapay Zeka Farkındalık Oyunu</h2>
        <p class="text-2xl text-slate-300 mb-8 max-w-3xl">Yapay zeka ile üretilmiş sahte görsellerin arasından gerçek olanı bulabilir misin?</p>
        
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl max-w-2xl w-full mb-8 flex flex-col gap-4 text-left">
            <input type="text" id="player-name" placeholder="Adınız Soyadınız" class="bg-slate-900 border-2 border-slate-600 rounded-lg px-6 py-4 w-full focus:outline-none focus:border-indigo-500 text-xl text-white placeholder-slate-500" autocomplete="off" />
            
            <div class="flex gap-4">
                <input type="number" id="player-age" placeholder="Yaşınız" class="bg-slate-900 border-2 border-slate-600 rounded-lg px-6 py-4 w-1/3 focus:outline-none focus:border-indigo-500 text-xl text-white placeholder-slate-500" autocomplete="off" min="5" max="100" />
                
                <div class="flex gap-2 w-2/3 h-full">
                    <button id="btn-gender-kadin" class="flex-1 bg-slate-900 border-2 border-slate-600 rounded-lg py-4 text-xl text-slate-400 hover:border-indigo-400 focus:outline-none transition-colors">Kadın</button>
                    <button id="btn-gender-erkek" class="flex-1 bg-slate-900 border-2 border-slate-600 rounded-lg py-4 text-xl text-slate-400 hover:border-indigo-400 focus:outline-none transition-colors">Erkek</button>
                </div>
            </div>
        </div>

        <button id="btn-start" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-5 px-16 rounded-full text-3xl transition-colors shadow-lg shadow-indigo-900/50">Oyuna Başla</button>
    </div>

    <!-- Screen 2: Game -->
    <div id="screen-game" class="flex-1 flex flex-col w-full h-full p-6 hidden justify-center">
        
        <div id="image-grid" class="w-full flex-1 flex flex-row gap-4 p-2 overflow-hidden justify-center items-stretch">
            <!-- Images will be injected here -->
        </div>
    </div>

    <!-- Screen 3: End -->
    <div id="screen-end" class="flex-1 flex flex-col items-center justify-center p-8 text-center hidden">
        <h2 class="text-5xl font-bold mb-6 text-indigo-400">Oyun Bitti!</h2>
        <div class="text-6xl font-bold text-slate-300 mb-10 drop-shadow-lg" id="final-stats">8 sorudan 5'ini doğru bildin!</div>
        <button id="btn-restart" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-full text-2xl transition-colors shadow-lg">Tekrar Oyna</button>
    </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="fixed inset-0 flex items-center justify-center bg-slate-900/90 z-50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div class="bg-slate-800 border-l-8 rounded-r-2xl p-10 max-w-4xl text-left shadow-2xl scale-95 transition-transform duration-300 flex flex-col gap-4" id="feedback-box">
            <div class="flex items-center gap-4 mb-2">
                <span id="feedback-icon" class="text-5xl"></span>
                <h3 id="feedback-title" class="text-4xl font-black text-white"></h3>
            </div>
            <p id="feedback-text" class="text-3xl text-slate-300 leading-relaxed font-medium"></p>
        </div>
    </div>

</div>

<script>
const quizData = [
  { 
      real: "belediye.jpg", 
      fakes: [
          { src: "belediyefake1.png", reason: "Yapay zeka hatası: İnsanların ayaklarında ve arka plandaki kamyonet lastiklerinde yapısal erimeler ve renk bozulmaları görülmektedir." },
          { src: "belediyefake2.png", reason: "Yapay zeka hatası: Kişilerin el ve ayak anatomilerinde (fazla parmak veya iç içe geçmiş uzuvlar) belirgin üretim hataları mevcuttur." }
      ] 
  },
  { 
      real: "giris.jpg", 
      fakes: [
          { src: "girisfake1.png", reason: "Yapay zeka hatası: Sol taraftaki mavi kulübenin üzerinde ve çevresindeki sütunlarda doku ve perspektif kaymaları bulunmaktadır." },
          { src: "girisfake2.png", reason: "Yapay zeka hatası: Tabelada alanla ilişkisiz, bağlam dışı bir metin (Kütahya Belediyesi) üretilmiştir." }
      ] 
  },
  { 
      real: "otogar.jpg", 
      fakes: [
          { src: "otogarfake1.png", reason: "Yapay zeka hatası: Otobüs üzerindeki marka isimleri hatalı üretilmiş olup, tabeladaki harfler elektrik direğiyle mantıksız şekilde iç içe geçmiştir." },
          { src: "otogarfake2.png", reason: "Yapay zeka hatası: Sütun mimarisinde renkler birbirine karışmış ve arka plandaki metinler anlamsız karakterlere dönüşmüştür." }
      ] 
  },
  { 
      real: "saat.jpg", 
      fakes: [
          { src: "saatfake1.jpg", reason: "Yapay zeka hatası: Arka plandaki elektrik direği yapısal olarak eksik ve mantıksız bir formda çizilmiştir." },
          { src: "saatfake2.png", reason: "Yapay zeka hatası: Elektrik direği ağaçla iç içe geçmiş, saatin üzerinde ise okunaksız ve birden fazla anlamsız kadran üretilmiştir." },
          { src: "saatfake3.jpg", reason: "Yapay zeka hatası: Direk ve ağaç dokuları birbirine karışmış, saat kadranındaki sayılar ve yapı tamamen deforme olmuştur." }
      ] 
  },
  { 
      real: "sera.jpeg", 
      fakes: [
          { src: "serafake1.png", reason: "Yapay zeka hatası: Turuncu dubalar fizik kurallarına aykırı şekilde havada durmakta ve logolardaki yazılar anlamsız metinlerden oluşmaktadır." },
          { src: "serafake2.png", reason: "Yapay zeka hatası: Havadaki dubalarla birlikte tabela fontlarında tutarsızlıklar ve markalarda anlamsız yapay zeka halüsinasyonları mevcuttur." }
      ] 
  },
  { 
      real: "tren.jpg", 
      fakes: [
          { src: "trenfake1.png", reason: "Yapay zeka hatası: Giriş kapısındaki sütunlarda ve insan siluetlerinin alt kısımlarında yapısal erimeler (doku bozulmaları) göze çarpmaktadır." }
      ] 
  },
  { 
      real: "vali.jpg", 
      fakes: [
          { src: "valifake1.png", reason: "Yapay zeka hatası: Kaldırım taşlarındaki perspektif kaybolmuş ve zemin dokusunda mantıksız düzleşmeler oluşmuştur." },
          { src: "valifake2.png", reason: "Yapay zeka hatası: Kaldırım dokusunun aniden kaybolmasının yanı sıra, bayrak direklerinde olağandışı renk bozulmaları görülmektedir." }
      ] 
  },
  { 
      real: "vazo.jpeg", 
      fakes: [
          { src: "vazofake1.png", reason: "Yapay zeka hatası: Vazonun alt kısmında dokular birbirine girmiş olup, arka plandaki bina kapıları ölçek olarak gerçek dışı büyüklükte üretilmiştir." },
          { src: "vazofake2.jpg", reason: "Yapay zeka hatası: Sol taraftaki ağaç dalları doğal yapısından uzak, asimetrik ve mantıksız bir formda şekillenmiştir." }
      ] 
  }
];

// Preload images strictly
const allImagePaths = [];
quizData.forEach(q => {
    allImagePaths.push(`images/${q.real}`);
    q.fakes.forEach(f => allImagePaths.push(`images/${f.src}`));
});

let questions = [];
let currentQuestionIndex = 0;
let score = 0;
let playerName = "";
let playerAge = "";
let playerGender = "";
let questionStartTime = 0;
let totalTimeMs = 0;
let totalSpeedBonus = 0;
let correctCount = 0;
let isAnswered = false;

const screenStart = document.getElementById('screen-start');
const screenGame = document.getElementById('screen-game');
const screenEnd = document.getElementById('screen-end');
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const inputName = document.getElementById('player-name');
const imageGrid = document.getElementById('image-grid');
const finalScoreEl = document.getElementById('final-score');

// Enforce strict image preloading using Fetch & Blobs to guarantee instant rendering
let loadedImages = 0;
const totalImages = allImagePaths.length;
const blobCache = {}; // Store raw image data in RAM
btnStart.disabled = true;
btnStart.textContent = `Yükleniyor... (%0)`;
btnStart.classList.add('opacity-50', 'cursor-not-allowed');

function checkPreloadComplete() {
    loadedImages++;
    const percent = Math.floor((loadedImages / totalImages) * 100);
    if (loadedImages < totalImages) {
        btnStart.textContent = `Yükleniyor... (%${percent})`;
    } else {
        btnStart.disabled = false;
        btnStart.textContent = "Oyuna Başla";
        btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
    }
}

allImagePaths.forEach(src => {
    fetch(src)
        .then(response => response.blob())
        .then(blob => {
            blobCache[src] = URL.createObjectURL(blob);
            checkPreloadComplete();
        })
        .catch(err => {
            console.error("Failed to load", src, err);
            blobCache[src] = src; // Fallback to network URL
            checkPreloadComplete();
        });
});

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

btnStart.addEventListener('click', startGame);
btnRestart.addEventListener('click', () => {
    screenEnd.classList.add('hidden');
    screenStart.classList.remove('hidden');
    
    // Clear inputs
    inputName.value = '';
    const ageEl = document.getElementById('player-age');
    if (ageEl) ageEl.value = '';
    
    // Reset gender buttons
    selectedGender = "";
    btnGenderKadin.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
    btnGenderKadin.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-600');
    btnGenderErkek.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
    btnGenderErkek.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-600');

    inputName.focus();
});

inputName.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') startGame();
});
const btnGenderKadin = document.getElementById('btn-gender-kadin');
const btnGenderErkek = document.getElementById('btn-gender-erkek');

let selectedGender = "";

btnGenderKadin.addEventListener('click', () => {
    selectedGender = "Kadın";
    btnGenderKadin.classList.add('bg-indigo-600', 'text-white', 'border-indigo-400');
    btnGenderKadin.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-600');
    btnGenderErkek.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
    btnGenderErkek.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-600');
});

btnGenderErkek.addEventListener('click', () => {
    selectedGender = "Erkek";
    btnGenderErkek.classList.add('bg-indigo-600', 'text-white', 'border-indigo-400');
    btnGenderErkek.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-600');
    btnGenderKadin.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
    btnGenderKadin.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-600');
});

function startGame() {
    playerName = inputName.value.trim();
    const ageEl = document.getElementById('player-age');
    
    playerAge = ageEl ? ageEl.value : "";
    playerGender = selectedGender;

    if (!playerName || !playerAge || !playerGender) {
        alert("Lütfen başlamadan önce İsim, Yaş ve Cinsiyet bilgilerinizi doldurun.");
        return;
    }

    questions = shuffleArray([...quizData]);
    currentQuestionIndex = 0;
    score = 0;
    totalTimeMs = 0;
    totalSpeedBonus = 0;
    correctCount = 0;
    
    screenStart.classList.add('hidden');
    screenGame.classList.remove('hidden');
    
    loadQuestion();
}

function loadQuestion() {
    isAnswered = false;
    const q = questions[currentQuestionIndex];
    
    let selectedFakes = [...q.fakes];
    shuffleArray(selectedFakes);
    // Bazen 2, bazen 1 fake seç
    const fakeCount = Math.floor(Math.random() * 2) + 1; // 1 or 2
    selectedFakes = selectedFakes.slice(0, fakeCount);

    const options = [{ src: q.real, isReal: true, reason: "Tebrikler, gerçek görseli buldunuz! Diğer seçeneklerde yapay zekanın ürettiği anatomik ve mantıksal hatalar mevcuttu." }];
    selectedFakes.forEach(f => options.push({ src: f.src, isReal: false, reason: f.reason }));
    shuffleArray(options);

    // Adjust container based on number of options
    // Use flex-wrap so 3 items will span 2 rows (2 on top, 1 centered on bottom)
    imageGrid.className = 'w-full flex flex-wrap justify-center content-center items-center gap-6 flex-1 px-4 h-full pb-4';

    imageGrid.innerHTML = '';
    
    options.forEach((opt, index) => {
        const imgWrapper = document.createElement('div');
        let cardClass = 'image-card relative rounded-3xl overflow-hidden border-8 border-transparent flex justify-center items-center shadow-2xl';
        
        if (options.length === 3) {
            cardClass += ' aspect-[2/1] w-[46%]';
            if (index === 1) {
                cardClass += ' anim-top-down';
            } else {
                cardClass += ' anim-bottom-up';
            }
        } else {
            cardClass += ' w-[48%] h-[75vh] anim-center';
        }
        
        imgWrapper.className = cardClass;
        
        const img = document.createElement('img');
        const imgSrc = `images/${opt.src}`;
        img.src = blobCache[imgSrc] || imgSrc; // Use instant RAM blob
        
        if (opt.src.startsWith('saat')) {
            img.className = 'object-cover object-right w-full h-full';
        } else {
            img.className = 'object-cover object-left w-full h-full';
        }
        
        img.alt = 'Seçenek';
        img.onerror = function() {
            this.onerror = null;
            this.parentElement.innerHTML = `<div class="text-gray-400 p-10 text-center border-2 border-dashed border-gray-300 w-full h-full flex items-center justify-center">Görsel Eksik:<br>${opt.src}</div>`;
        };
        
        imgWrapper.appendChild(img);
        
        imgWrapper.addEventListener('click', () => handleAnswer(imgWrapper, opt.isReal, opt.reason));
        imageGrid.appendChild(imgWrapper);
    });
    
    // Start timing the question
    questionStartTime = Date.now();
}

function handleAnswer(element, isReal, reason) {
    if (isAnswered) return;
    isAnswered = true;

    const timeTakenMs = Date.now() - questionStartTime;
    totalTimeMs += timeTakenMs;

    // Highlight all to show correct/wrong
    const cards = imageGrid.querySelectorAll('.image-card');
    cards.forEach(card => card.style.cursor = 'default');

    if (isReal) {
        element.classList.add('correct');
        score += 100; // Base 100 points
        correctCount++;
        
        let bonus = 0;
        if (timeTakenMs <= 2000) {
            bonus = 100;
        } else if (timeTakenMs < 15000) {
            const ratio = 1 - ((timeTakenMs - 2000) / 13000);
            bonus = Math.round(ratio * 100);
        }
        score += bonus;
        totalSpeedBonus += bonus;
    } else {
        element.classList.add('wrong');
        // Find and highlight the real one
        const realImageSrc = questions[currentQuestionIndex].real;
        cards.forEach(card => {
            const img = card.querySelector('img');
            if (img && img.src.includes(realImageSrc)) {
                card.classList.add('correct');
            }
        });
    }

    // Show feedback modal
    const modal = document.getElementById('feedback-modal');
    const modalBox = document.getElementById('feedback-box');
    const modalIcon = document.getElementById('feedback-icon');
    const modalTitle = document.getElementById('feedback-title');
    const modalText = document.getElementById('feedback-text');

    if (isReal) {
        modalBox.className = "bg-slate-800 border-l-8 border-green-500 rounded-r-2xl p-10 max-w-4xl text-left shadow-2xl scale-95 transition-transform duration-300 flex flex-col gap-4";
        modalIcon.textContent = "✅";
        modalTitle.textContent = "Doğru!";
        modalTitle.className = "text-4xl font-black text-green-400";
    } else {
        modalBox.className = "bg-slate-800 border-l-8 border-red-500 rounded-r-2xl p-10 max-w-4xl text-left shadow-2xl scale-95 transition-transform duration-300 flex flex-col gap-4";
        modalIcon.textContent = "❌";
        modalTitle.textContent = "Yanlış!";
        modalTitle.className = "text-4xl font-black text-red-400";
    }

    modalText.textContent = reason;
    
    modal.classList.remove('hidden');
    // slight delay for opacity transition
    setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalBox.classList.remove('scale-95');
        modalBox.classList.add('scale-100');
    }, 10);

    setTimeout(() => {
        // Hide modal
        modal.classList.add('opacity-0');
        modalBox.classList.remove('scale-100');
        modalBox.classList.add('scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 300);
    }, 4500); // Wait 4.5 seconds to read
}

function endGame() {
    setTimeout(() => {
        screenGame.classList.add('hidden');
        screenEnd.classList.remove('hidden');

        document.getElementById('final-stats').textContent = `${questions.length} sorudan ${correctCount} tanesini doğru bildin!`;
        saveScore(playerName, score);
    }, 500);
}

function saveScore(name, score) {
    // We save standard leaderboard data, but extended for analytics
    let leaderboard = JSON.parse(localStorage.getItem('aiGameAnalytics')) || [];
    leaderboard.push({ 
        name: playerName, 
        age: playerAge,
        gender: playerGender,
        score: score, 
        correctCount: correctCount,
        totalQuestions: questions.length,
        totalTimeSeconds: Math.round(totalTimeMs / 1000),
        speedBonus: totalSpeedBonus,
        date: new Date().toISOString() 
    });
    
    // Sort descending by score
    leaderboard.sort((a, b) => b.score - a.score);
    
    localStorage.setItem('aiGameAnalytics', JSON.stringify(leaderboard));
    
    // Also save simple format for backwards compatibility with the TV leaderboard screen
    let simpleLeaderboard = leaderboard.map(entry => ({
        name: entry.name,
        score: entry.score,
        date: entry.date
    })).slice(0, 20); // only keep top 20 for simple display
    localStorage.setItem('aiGameLeaderboard', JSON.stringify(simpleLeaderboard));
    window.dispatchEvent(new Event('storage'));
}

// Add a hidden shortcut (Ctrl+Shift+E) to export analytics to CSV
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key === 'E') {
        exportAnalyticsCSV();
    }
});

function exportAnalyticsCSV() {
    const data = JSON.parse(localStorage.getItem('aiGameAnalytics')) || [];
    if (data.length === 0) {
        alert("Henüz kaydedilmiş kullanıcı verisi yok.");
        return;
    }
    
    const headers = ['Tarih', 'İsim', 'Yaş', 'Cinsiyet', 'Doğru Sayısı', 'Toplam Soru', 'Geçen Süre (sn)', 'Hız Bonusu', 'Toplam Puan'];
    const csvRows = [headers.join(',')];
    
    data.forEach(row => {
        const values = [
            row.date,
            `"${row.name}"`,
            row.age,
            `"${row.gender}"`,
            row.correctCount,
            row.totalQuestions,
            row.totalTimeSeconds,
            row.speedBonus,
            row.score
        ];
        csvRows.push(values.join(','));
    });
    
    // Add BOM for Excel UTF-8 compatibility
    const csvString = '\uFEFF' + csvRows.join('\n');
    const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `Yapay_Zeka_Oyun_Verileri_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// Register Service Worker for true offline capabilities
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('ServiceWorker registration successful');
        }).catch(err => {
            console.log('ServiceWorker registration failed: ', err);
        });
    });
}
</script>
</body>
</html>
